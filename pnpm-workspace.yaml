packages:
  - 'packages/jaeger-ui'
  - 'packages/plexus'

allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false

catalog:
  '@noble/hashes': 2.4.0
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.3b99001a24f162be6a4478c3b97f3d0eb81c96c8
  vitest: 5.0.4
  vite-plus: 0.0.0-commit.3b99001a24f162be6a4478c3b97f3d0eb81c96c8
  '@vitest/coverage-v8': 5.0.4

overrides:
  react: 19.3.0
  react-dom: 19.3.0
  yaml: 2.9.0
  '@types/node': 24.13.1
  '@exodus/bytes>@noble/hashes': 'catalog:'
  '@assistant-ui/core': 0.3.3
  '@assistant-ui/store': 0.3.2
  '@assistant-ui/tap': 0.9.9
  brace-expansion: 5.0.9
  browserslist: 4.29.0
  fast-uri: 4.2.1
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - vite-plus
  - '@voidzero-dev/*'
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
